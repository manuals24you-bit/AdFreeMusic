org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Wersja NewPipeExtractor. GitHub Actions podbija ją automatycznie,
# gdy pojawi się nowe wydanie (patrz .github/workflows/auto-update.yml).
extractorVersion=v0.26.5

# Twoje repozytorium na GitHubie w formacie "uzytkownik/nazwa".
# Z jego zakładki Releases aplikacja pobiera nowe wersje APK.
updateRepo=TWOJ_LOGIN/AdFreeMusic
